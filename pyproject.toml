[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "SVGraft"
dynamic = ["version"]
authors = [
  { name="Derek Baier", email="derek.m.baier@gmail.com" },
]
description = "Split SVG files to multiple pages, with margins and guides"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/deekb/SVGraft"
Issues = "https://github.com/deekb/SVGraft/issues"

[project.scripts]
svgraft = "svgraft.example:main"