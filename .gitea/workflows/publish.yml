name: Publish to PyPI

# Push a tag like v0.0.6 (must match svgraft.__version__) to release.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('src/svgraft/__init__.py').read()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "Tag does not match __version__"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
